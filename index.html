<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হোম | খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া ইন্টারন্যাশনাল হিফজ একাডেমি</title>
    <meta name="description" content="খাগড়াছড়ি বায়তুশ শরফ জব্বারিয়া ইন্টারন্যাশনাল হিফজ একাডেমি — হিফজুল কুরআন, কওমি-আলিয়া সমন্বিত শিক্ষা এবং আরবি-ইংরেজি, বিজ্ঞান ও রোবোটিক্সের অনন্য সমন্বয়।">
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Config File (Google Sheet Web App URL) -->
    <script src="config.js"></script>

    <style>
        :root {
            --gov-green: #006a4e;
            --gov-dark-green: #0f4c3a;
            --gov-purple: #683091;
            --gov-red: #d32f2f;
            --gov-gold: #b9852a;
            --box-bg: #f9f9f9;
            --border-color: #dcdcdc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #e9ecef;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 16px 16px;
            color: #222;
            line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; transition: 0.2s; }
        ul { list-style: none; }

        /* Main Portal Container (Dhaka Education Board Style) */
        .portal-wrapper {
            max-width: 1140px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 0 18px rgba(0,0,0,0.12);
            min-height: 100vh;
        }

        /* Top Purple/Green Bar */
        .top-bar {
            background: var(--gov-purple);
            color: #fff;
            padding: 6px 15px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 3px solid var(--gov-green);
        }
        .top-bar-links a {
            color: #fff;
            margin-left: 12px;
            padding: 2px 10px;
            border-radius: 3px;
            background: rgba(255,255,255,0.15);
            font-weight: 500;
        }
        .top-bar-links a:hover { background: var(--gov-gold); }

        /* Header Banner / Slider */
        .header-banner {
            position: relative;
            background: linear-gradient(135deg, #0f4c3a 0%, #006a4e 60%, #134e4a 100%);
            color: #fff;
            padding: 22px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-bottom: 1px solid #ccc;
            overflow: hidden;
        }
        .header-banner::after {
            content: "وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ";
            position: absolute;
            right: 25px;
            bottom: 8px;
            font-size: 28px;
            opacity: 0.14;
            font-weight: bold;
            pointer-events: none;
        }
        .brand-box {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
        }
        .brand-logo {
            width: 76px;
            height: 76px;
            background: #fff;
            border-radius: 50%;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
            font-size: 32px;
            color: var(--gov-dark-green);
            font-weight: 700;
        }
        .brand-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .brand-text h1 {
            font-size: 23px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            line-height: 1.25;
        }
        .brand-text p {
            font-size: 14px;
            color: #fde68a;
            margin-top: 3px;
        }
        .header-badge {
            z-index: 2;
            background: rgba(0,0,0,0.28);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 14px;
            border-radius: 6px;
            text-align: right;
            font-size: 13px;
        }

        /* Navigation Bar */
        .main-nav {
            background: #006a4e;
            border-bottom: 3px solid #b9852a;
        }
        .nav-list {
            display: flex;
            flex-wrap: wrap;
        }
        .nav-list > li {
            position: relative;
            border-right: 1px solid rgba(255,255,255,0.15);
        }
        .nav-list > li > a {
            display: block;
            padding: 10px 15px;
            color: #fff;
            font-size: 14.5px;
            font-weight: 600;
        }
        .nav-list > li:hover > a, .nav-list > li > a.active {
            background: #0f4c3a;
            color: #fde68a;
        }
        /* Dropdown */
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            min-width: 220px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.18);
            border-top: 3px solid var(--gov-purple);
            z-index: 100;
        }
        .dropdown li { border-bottom: 1px solid #eee; }
        .dropdown li a {
            display: block;
            padding: 8px 14px;
            color: #333;
            font-size: 14px;
        }
        .dropdown li a:hover {
            background: #f0fdf4;
            color: var(--gov-green);
            padding-left: 18px;
        }
        .nav-list > li:hover .dropdown { display: block; }
        .mobile-menu-btn {
            display: none;
            background: #0f4c3a;
            color: #fff;
            border: none;
            width: 100%;
            text-align: left;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* News Ticker (খবর/নোটিশ স্ক্রল) */
        .news-ticker {
            display: flex;
            align-items: center;
            background: #fff8e6;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .ticker-label {
            background: var(--gov-red);
            color: #fff;
            padding: 7px 14px;
            font-weight: 700;
            white-space: nowrap;
            font-size: 13.5px;
        }
        .ticker-content {
            flex: 1;
            overflow: hidden;
            padding: 6px 12px;
        }
        .ticker-content marquee a {
            margin-right: 35px;
            color: #1e293b;
            font-weight: 600;
        }
        .ticker-content marquee a:hover { color: var(--gov-red); text-decoration: underline; }

        /* Admission Ribbon */
        .admission-strip {
            background: linear-gradient(90deg, #fef3c7, #fde68a);
            border-bottom: 1px solid #f59e0b;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 14px;
        }
        .admission-strip strong { color: #92400e; }
        .btn-apply-now {
            background: #b91c1c;
            color: #fff;
            padding: 4px 14px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
        }

        /* Main 2-Column Portal Grid */
        .portal-body {
            display: grid;
            grid-template-columns: 7fr 3fr;
            gap: 18px;
            padding: 18px;
        }

        /* Official Notice Board Box (Exact Government Portal Style) */
        .notice-board-box {
            background: linear-gradient(to bottom, #ffffff 0%, #f3f4f6 100%);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--gov-green);
            padding: 18px 20px;
            position: relative;
            margin-bottom: 18px;
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }
        .notice-globe {
            width: 68px;
            height: 68px;
            background: #e6f4ea;
            border: 2px solid var(--gov-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }
        .notice-content { flex: 1; }
        .notice-content h2 {
            font-size: 20px;
            color: var(--gov-dark-green);
            margin-bottom: 10px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
        }
        .notice-list li {
            padding: 5px 0;
            border-bottom: 1px dotted #e5e7eb;
            font-size: 14.5px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .notice-list li::before {
            content: "▶";
            color: var(--gov-green);
            font-size: 11px;
        }
        .notice-list li a:hover {
            color: var(--gov-green);
            text-decoration: underline;
        }
        .notice-date {
            font-size: 12px;
            color: #666;
            margin-left: auto;
            white-space: nowrap;
        }
        .notice-all-btn {
            display: inline-block;
            margin-top: 10px;
            background: #6b7280;
            color: #fff;
            padding: 4px 14px;
            font-size: 13px;
            border-radius: 3px
