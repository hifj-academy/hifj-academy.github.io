<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>পাতাটি পাওয়া যায়নি — বায়তুশ শরফ হিফজ একাডেমি</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;600&display=swap">
<style>
:root{--brand:#0f4c3a;--gold:#e7c27a;--ink:#13221c;--muted:#53655d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#f5f8f6;color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;text-align:center}
.box{max-width:520px}
img{width:88px;height:88px;border-radius:0;object-fit:contain}
.code{font-family:"Tiro Bangla",serif;font-size:4.5rem;color:var(--brand);line-height:1;margin:16px 0 6px}
h1{font-family:"Tiro Bangla",serif;font-weight:400;color:var(--brand);font-size:1.6rem;margin:0 0 10px}
p{color:var(--muted);margin:0 0 22px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;padding:10px 20px;border-radius:99px;text-decoration:none;font-weight:600;background:var(--brand);color:#fff}
a.btn.l{background:#fff;color:var(--brand);border:1px solid var(--brand)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main class="box">
  <img src="/assets/img/logo-192.png" alt="">
  <div class="code">৪০৪</div>
  <h1>দুঃখিত, পাতাটি পাওয়া যায়নি</h1>
  <p>লিংকটি ভুল হতে পারে, অথবা পাতাটি সরানো হয়েছে। মূল পাতা থেকে আবার চেষ্টা করুন।</p>
  <div class="row"><a class="btn" href="/">মূল পাতায় যান</a><a class="btn l" href="/#notice">নোটিশ বোর্ড</a><a class="btn l" href="/#contact">যোগাযোগ</a></div>
</main>
</body>
</html>
