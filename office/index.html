<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বায়তুশ শরফ অফিস</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f4c3a">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f6f4; --surface:#fff; --band:#e7efea; --ink:#15231d; --muted:#5a6b63; --line:#d5e0da;
  --brand:#0f4c3a; --brand2:#1b6b52; --gold:#b9852a; --goldsoft:#f6ecd6;
  --ok:#1d7a4c; --oksoft:#e2f3e9; --bad:#b3261e; --badsoft:#fbe7e5; --warn:#9a5b0f; --warnsoft:#fbefdc;
  --f:"Nirmala UI","Noto Sans Bengali","Hind Siliguri","Vrinda","SolaimanLipi",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--brand);color:#eef5f1;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:10px}
.brand img,.brand .lg{width:38px;height:38px;border-radius:8px;background:#e7c27a;flex:none;object-fit:cover;display:grid;place-items:center;color:#1a1205;font-weight:700}
.brand b{display:block;font-size:.95rem;line-height:1.25}
.brand small{opacity:.75;font-size:.75rem}
aside nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px}
aside nav a:hover{background:rgba(255,255,255,.08)}
aside nav a.on{background:#e7c27a;color:#1a1205;font-weight:600}
.pill{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:.75rem}
.who{margin-top:14px;padding:10px;border-top:1px solid rgba(255,255,255,.15);font-size:.85rem}
.who button{margin-top:6px;background:transparent;border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:6px;padding:3px 10px;cursor:pointer}
main{padding:18px 22px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:1.45rem;color:var(--brand)}
.sync{font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.btn.menu{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .btn.menu{display:inline-block}
  main{padding:14px 14px 60px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:1.1rem;color:var(--brand)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat span{color:var(--muted);font-size:.85rem}
.stat b{display:block;font-size:1.6rem;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.3}
.stat small{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{min-width:0}
label{display:grid;gap:3px;font-size:.88rem;font-weight:600;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#fff;font-weight:400;color:var(--ink);min-width:0}
textarea{min-height:64px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.l{background:#fff;color:var(--brand)}
.btn.g{background:var(--gold);border-color:var(--gold);color:#1a1205}
.btn.r{background:var(--bad);border-color:var(--bad)}
.btn.s{padding:3px 10px;font-size:.85rem}
.btn.wa{background:#1f9d55;border-color:#1f9d55}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs a{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.tabs a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top;font-variant-numeric:tabular-nums}
th{background:var(--band);color:var(--brand);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--band);color:var(--brand)}
.tag.ok{background:var(--oksoft);color:var(--ok)}.tag.bad{background:var(--badsoft);color:var(--bad)}.tag.warn{background:var(--warnsoft);color:var(--warn)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.empty{padding:26px;text-align:center;color:var(--muted)}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--warnsoft);color:var(--warn);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.att{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.att label{display:block;cursor:pointer;font-weight:600;color:var(--ink)}
.att input{display:none}
.att span{display:block;padding:3px 10px;font-size:.85rem}
.att input:checked+span.P{background:var(--ok);color:#fff}
.att input:checked+span.A{background:var(--bad);color:#fff}
.att input:checked+span.L,.att input:checked+span.CL,.att input:checked+span.ML{background:var(--gold);color:#1a1205}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem}
.cal div{padding:6px 0;border-radius:6px;background:var(--band)}
.cal .h{background:none;font-weight:600;color:var(--muted)}
.cal .fri{color:var(--bad)}
.cal .today{background:var(--brand);color:#fff;font-weight:700}
.cal .x{background:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:start center;overflow-y:auto;padding:30px 12px}
.modal .box{background:var(--surface);border-radius:12px;padding:18px;width:min(720px,100%)}
.modal h2{margin:0 0 14px;color:var(--brand);font-size:1.2rem}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:8px;z-index:80}
.login{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--brand)}
.login .box{background:#fff;border-radius:14px;padding:24px;width:min(420px,100%)}
.login h1{margin:0 0 4px;color:var(--brand);font-size:1.3rem}
.chk{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--ink)}
.chk input{width:auto}
.mlist{display:flex;flex-wrap:wrap;gap:6px}
.mlist label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-weight:400;color:var(--ink)}
.right{text-align:end}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block}
  @page{size:A4;margin:10mm}
}
.pr{font-family:var(--f);color:#000;font-size:13px}
.pr h1{font-size:18px;margin:0}.pr h2{font-size:15px;margin:6px 0}
.pr table{border-collapse:collapse;width:100%}
.pr th,.pr td{border:1px solid #444;padding:4px 6px;background:none;color:#000}
.phead{display:flex;gap:10px;align-items:center;justify-content:center;text-align:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.phead img{width:54px;height:54px;object-fit:contain}
.rcpt{height:136mm;padding:4mm 2mm;position:relative;overflow:hidden}
.rcpt+.rcpt{border-top:1px dashed #000}
.copy{position:absolute;top:4mm;right:2mm;border:1px solid #000;padding:1px 8px;font-size:11px}
.sig{display:flex;justify-content:space-between;margin-top:26px}
.sig span{border-top:1px solid #000;padding-top:2px;min-width:140px;text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<div id="print"></div>
<script>
"use strict";
/* ============ মূল তথ্য ও সংরক্ষণ ============ */
const APP_VER = "1.3";
const TABLES = ["students","applications","attendance","staff","staffAttendance","payments","waivers","requests","classes","feeHeads","users","settings","notices","books"];
const SITE_URL = "https://hifj-academy.github.io";
const PORTAL_URL = SITE_URL + "/student.html";
let DB = {}; TABLES.forEach(t => DB[t] = {});
let META = { dirty:{}, lastSync:0, device:"", rc:1, sync:{url:"",key:"",auto:true}, logo:"", sent:{}, lastSnap:"" };
let ME = null;         // লগইনকৃত ব্যবহারকারী
const UI = {};         // অস্থায়ী পর্দার অবস্থা

const DIG = "০১২৩৪৫৬৭৮৯";
const bn = s => String(s ?? "").replace(/\d/g, d => DIG[d]);
const en = s => String(s ?? "").replace(/[০-৯]/g, d => DIG.indexOf(d));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(en(v).replace(/,/g,"")); return isFinite(n) ? n : 0; };
const money = n => "৳ " + bn(Math.round(n).toLocaleString("en-IN"));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const thisMonth = () => today().slice(0,7);
const MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const DAYS = ["রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র","শনি"];
const mName = ym => { if(!ym) return ""; const [y,m] = ym.split("-"); return MONTHS[+m-1]+" "+bn(y); };
const dFmt = s => { if(!s) return "—"; const [y,m,d] = s.split("-"); return bn(+d)+" "+MONTHS[+m-1]+" "+bn(y); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function monthsRange(a, b){ const out=[]; if(!a||!b||a>b) return out; let [y,m]=a.split("-").map(Number); const [by,bm]=b.split("-").map(Number); while(y<by||(y===by&&m<=bm)){ out.push(y+"-"+pad(m)); m++; if(m>12){m=1;y++;} } return out; }
function addMonths(ym, k){ let [y,m]=ym.split("-").map(Number); m+=k; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"-"+pad(m); }

/* টাকার অঙ্ক কথায় */
const W = ",এক,দুই,তিন,চার,পাঁচ,ছয়,সাত,আট,নয়,দশ,এগারো,বারো,তেরো,চৌদ্দ,পনেরো,ষোলো,সতেরো,আঠারো,উনিশ,বিশ,একুশ,বাইশ,তেইশ,চব্বিশ,পঁচিশ,ছাব্বিশ,সাতাশ,আটাশ,ঊনত্রিশ,ত্রিশ,একত্রিশ,বত্রিশ,তেত্রিশ,চৌত্রিশ,পঁয়ত্রিশ,ছত্রিশ,সাঁইত্রিশ,আটত্রিশ,ঊনচল্লিশ,চল্লিশ,একচল্লিশ,বিয়াল্লিশ,তেতাল্লিশ,চুয়াল্লিশ,পঁয়তাল্লিশ,ছেচল্লিশ,সাতচল্লিশ,আটচল্লিশ,ঊনপঞ্চাশ,পঞ্চাশ,একান্ন,বাহান্ন,তিপ্পান্ন,চুয়ান্ন,পঞ্চান্ন,ছাপ্পান্ন,সাতান্ন,আটান্ন,ঊনষাট,ষাট,একষট্টি,বাষট্টি,তেষট্টি,চৌষট্টি,পঁয়ষট্টি,ছেষট্টি,সাতষট্টি,আটষট্টি,ঊনসত্তর,সত্তর,একাত্তর,বাহাত্তর,তিয়াত্তর,চুয়াত্তর,পঁচাত্তর,ছিয়াত্তর,সাতাত্তর,আটাত্তর,ঊনআশি,আশি,একাশি,বিরাশি,তিরাশি,চুরাশি,পঁচাশি,ছিয়াশি,সাতাশি,আটাশি,ঊননব্বই,নব্বই,একানব্বই,বিরানব্বই,তিরানব্বই,চুরানব্বই,পঁচানব্বই,ছিয়ানব্বই,সাতানব্বই,আটানব্বই,নিরানব্বই".split(",");
function inWords(n){
  n = Math.floor(Math.abs(n)); if(n===0) return "শূন্য";
  const p=[]; const cr=Math.floor(n/1e7); n%=1e7;
  if(cr) p.push(inWords(cr)+" কোটি");
  const lk=Math.floor(n/1e5); n%=1e5; if(lk) p.push(W[lk]+" লক্ষ");
  const th=Math.floor(n/1000); n%=1000; if(th) p.push(W[th]+" হাজার");
  const h=Math.floor(n/100); n%=100; if(h) p.push(W[h]+" শত");
  if(n) p.push(W[n]);
  return p.join(" ");
}

/* IndexedDB সংরক্ষণ (ব্যর্থ হলে localStorage) */
const IDB = {
  db:null,
  open(){ return new Promise(res => { try{ const r = indexedDB.open("bjha_mms",1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); }catch(e){ res(false); } }); },
  get(k){ return new Promise(res => { if(!this.db){ try{ res(JSON.parse(localStorage.getItem("bjha_"+k))); }catch(e){ res(null); } return; } const q=this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result??null); q.onerror=()=>res(null); }); },
  set(k,v){ return new Promise(res => { if(!this.db){ try{ localStorage.setItem("bjha_"+k, JSON.stringify(v)); }catch(e){} res(); return; } const t=this.db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); },
  del(k){ return new Promise(res => { if(!this.db){ try{localStorage.removeItem("bjha_"+k);}catch(e){} res(); return; } const t=this.db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=()=>res(); }); },
  keys(){ return new Promise(res => { if(!this.db){ res([]); return; } const q=this.db.transaction("kv").objectStore("kv").getAllKeys(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]); }); }
};
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(flush, 250); }
async function flush(){ await IDB.set("db", DB); await IDB.set("meta", META); await dailySnapshot(); }
async function dailySnapshot(){
  const d = today(); if(META.lastSnap === d) return;
  META.lastSnap = d; await IDB.set("snap-"+d, DB); await IDB.set("meta", META);
  const ks = (await IDB.keys()).filter(k => String(k).startsWith("snap-")).sort();
  while(ks.length > 7) await IDB.del(ks.shift());
}

/* রেকর্ড পরিচালনা */
function put(t, rec){ rec.updatedAt = Date.now(); rec.by = ME ? ME.id : ""; DB[t][rec.id] = rec; META.dirty[t+"|"+rec.id] = 1; save(); return rec; }
function remove(t, id){ const r = DB[t][id]; if(r){ r.deleted = true; put(t, r); } }
const all = t => Object.values(DB[t]).filter(r => !r.deleted);
const get = (t, id) => { const r = DB[t][id]; return r && !r.deleted ? r : null; };
const S = () => DB.settings.main || {};
function setS(patch){ put("settings", Object.assign({id:"main"}, S(), patch)); }

/* ভূমিকা ও অনুমতি */
const ROLES = { admin:"ব্যবস্থাপক", office:"অফিস সহকারী", teacher:"শিক্ষক" };
const CAN = {
  admin:["dashboard","approvals","applications","students","attendance","fees","staff","website","settings","backup"],
  office:["dashboard","approvals","applications","students","attendance","fees","staff","website","backup"],
  teacher:["dashboard","attendance","students"]
};
const can = page => ME && CAN[ME.role].includes(page);
const isAdmin = () => ME && ME.role === "admin";

async function hashPin(pin, salt){
  const s = salt + ":" + en(pin);
  try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return "f"+(h>>>0).toString(16); }
}

function genPin(){ try{ const a = new Uint32Array(1); crypto.getRandomValues(a); return String(100000 + a[0] % 900000); }catch(e){ return String(100000 + Math.floor(Math.random()*900000)); } }

/* শ্রেণি ও শিক্ষার্থী সহায়ক */
const DEPTS = ["নূরানী বিভাগ","জেনারেল হিফজ বিভাগ","একাডেমিক হিফজ বিভাগ","কিতাব বিভাগ"];
const classesSorted = () => all("classes").sort((a,b)=>(a.order||0)-(b.order||0));
const className = id => { const c = get("classes", id); return c ? c.name + (c.dept ? " ("+c.dept.replace(" বিভাগ","")+")" : "") : "—"; };
const activeStudents = () => all("students").filter(s => s.status !== "left");
const classOptions = (sel, withAll) => (withAll?`<option value="">সব শ্রেণি</option>`:"") + DEPTS.map(d => {
  const cs = classesSorted().filter(c => c.dept === d); if(!cs.length) return "";
  return `<optgroup label="${esc(d)}">` + cs.map(c => `<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("") + `</optgroup>`;
}).join("") + classesSorted().filter(c=>!DEPTS.includes(c.dept)).map(c => `<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("");
const studentLabel = s => s ? `${s.id} — ${s.name}` : "";

/* ফোন ও হোয়াটসঅ্যাপ */
function waPhone(p){ let d = en(p).replace(/\D/g,""); if(!d) return ""; if(d.startsWith("880")) return d; if(d.startsWith("0")) return "88"+d; if(d.length===10 && d.startsWith("1")) return "880"+d; return d; }
function waLink(phone, msg){ const p = waPhone(phone); return p ? "https://wa.me/"+p+"?text="+encodeURIComponent(msg) : ""; }
function fillTpl(tpl, map){ return String(tpl||"").replace(/\{([^}]+)\}/g, (m,k) => map[k] ?? m); }

/* ফি ও বকেয়া হিসাব */
function paidMonths(sid){ const set = new Set(); all("payments").filter(p=>p.sid===sid).forEach(p => (p.items||[]).forEach(i => { if(i.month) set.add(i.month); })); return set; }
function waivedMonths(sid){ const set = new Set(); all("waivers").filter(w=>w.sid===sid && w.status==="approved").forEach(w => (w.months||[]).forEach(m=>set.add(m))); return set; }
function dueCutoff(){ const d = new Date(); const day = num(S().dueDay)||10; return d.getDate() >= day ? thisMonth() : addMonths(thisMonth(), -1); }
function startMonth(s){ const a = (s.admissionDate||today()).slice(0,7); const ss = S().sessionStart || ""; return ss && ss > a ? ss : a; }
function unpaid(s, upto){
  if(!s || !(num(s.monthlyFee) > 0)) return [];
  const p = paidMonths(s.id), w = waivedMonths(s.id);
  return monthsRange(startMonth(s), upto || dueCutoff()).filter(m => !p.has(m) && !w.has(m));
}
function duesList(){
  return activeStudents().map(s => { const m = unpaid(s); return { s, months:m, amount:m.length*num(s.monthlyFee) }; }).filter(x => x.amount > 0).sort((a,b)=>b.amount-a.amount);
}

/* CSV */
function toCSV(rows, cols){ const q = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }; return "﻿" + [cols.map(c=>q(c[1])).join(",")].concat(rows.map(r => cols.map(c => q(r[c[0]])).join(","))).join("\n"); }
function parseCSV(text){
  text = text.replace(/^﻿/,""); const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=""; } else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(c!=='\r') cur+=c; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

/* সিঙ্ক — গুগল শিটের সাথে */
let syncing = false;
async function syncNow(manual){
  const cfg = META.sync || {};
  if(!cfg.url || !cfg.key){ if(manual) toast("সেটিংসে সিঙ্ক লিংক ও কী দিন"); return; }
  if(!navigator.onLine){ if(manual) toast("ইন্টারনেট নেই — সংযোগ পেলে সিঙ্ক হবে"); return; }
  if(syncing) return; syncing = true; setSyncBadge("সিঙ্ক হচ্ছে…");
  try{
    const changes = Object.keys(META.dirty).map(k => { const i = k.indexOf("|"); const t = k.slice(0,i), id = k.slice(i+1); return DB[t] && DB[t][id] ? {t, r:DB[t][id]} : null; }).filter(Boolean);
    const res = await fetch(cfg.url, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({ key:cfg.key, since:META.lastSync||0, changes, device:META.device, ver:APP_VER }) });
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || "সার্ভার ত্রুটি");
    changes.forEach(c => { const k = c.t+"|"+c.r.id; if(DB[c.t][c.r.id] && DB[c.t][c.r.id].updatedAt === c.r.updatedAt) delete META.dirty[k]; });
    let got = 0;
    (j.records||[]).forEach(({t, r}) => { if(!DB[t] || !r || !r.id) return; const cur = DB[t][r.id]; if(META.dirty[t+"|"+r.id]) return; if(!cur || (r.updatedAt||0) >= (cur.updatedAt||0)){ if(!cur || cur.updatedAt !== r.updatedAt) got++; DB[t][r.id] = r; } });
    META.lastSync = j.now; META.lastSyncAt = Date.now(); await flush();
    setSyncBadge();
    if(manual) toast("সিঙ্ক সম্পন্ন" + (got ? " — নতুন/হালনাগাদ " + bn(got) + "টি" : ""));
    if(got) render();
  }catch(e){ setSyncBadge("সিঙ্ক ব্যর্থ"); if(manual) toast("সিঙ্ক হয়নি: " + e.message); }
  syncing = false;
}
function setSyncBadge(text){
  const el = document.getElementById("syncb"); if(!el) return;
  const pending = Object.keys(META.dirty).length;
  const online = navigator.onLine;
  el.innerHTML = `<span class="dot ${online?"on":"off"}"></span>${text || (online?"অনলাইন":"অফলাইন")} • ${META.lastSyncAt ? "শেষ সিঙ্ক " + bn(new Date(META.lastSyncAt).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})) : "সিঙ্ক হয়নি"}${pending?` • অপেক্ষমাণ ${bn(pending)}`:""} <button class="btn s l" data-act="sync">সিঙ্ক</button>`;
}
window.addEventListener("online", () => { setSyncBadge(); if(META.sync.auto) syncNow(); });
window.addEventListener("offline", () => setSyncBadge());

VIEWS.attendance = arg => {
  const [tab0] = (arg||"").split("/"); const tab = ["students","staff","report","staffReport"].includes(tab0) ? tab0 : "students";
  if(ME.role==="teacher" && tab.startsWith("staff")) return `<div class="card empty">অনুমতি নেই</div>`;
  const tabs = `<div class="tabs"><a href="#attendance/students" class="${tab==="students"?"on":""}">শিক্ষার্থী হাজিরা</a><a href="#attendance/report" class="${tab==="report"?"on":""}">শিক্ষার্থী রিপোর্ট</a>${ME.role!=="teacher"?`<a href="#attendance/staff" class="${tab==="staff"?"on":""}">শিক্ষক-কর্মচারী হাজিরা</a><a href="#attendance/staffReport" class="${tab==="staffReport"?"on":""}">শিক্ষক রিপোর্ট</a>`:""}</div>`;
  const a = UI.att || (UI.att = { date:today(), cls:(classesSorted()[0]||{}).id||"", from:thisMonth()+"-01", to:today() });
  if(tab === "students"){
    const list = activeStudents().filter(s=>s.classId===a.cls).sort((x,y)=>(num(x.roll)-num(y.roll))||x.id.localeCompare(y.id,"en",{numeric:true}));
    const rec = get("attendance", a.date+"_"+a.cls); const marks = (rec&&rec.marks)||{};
    const absent = rec ? list.filter(s=>marks[s.id]==="A") : [];
    return tabs + `<div class="card"><div class="row"><label>তারিখ<input type="date" data-change="att" data-k="date" value="${a.date}"></label><label style="flex:1 1 240px">শ্রেণি<select data-change="att" data-k="cls">${classOptions(a.cls)}</select></label>${rec?`<span class="tag ok" style="align-self:center">এই দিনের হাজিরা নেওয়া হয়েছে</span>`:""}</div></div>
    ${list.length?`<form data-form="saveAtt"><div class="tw"><table><tr><th>রোল</th><th>আইডি</th><th>নাম</th><th>হাজিরা</th></tr>${list.map(s=>{const v=marks[s.id]||"P"; return `<tr><td>${esc(bn(s.roll))}</td><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td><span class="att">${[["P","উপস্থিত"],["A","অনুপস্থিত"],["L","ছুটি"]].map(([k,l])=>`<label><input type="radio" name="${esc(s.id)}" value="${k}" ${v===k?"checked":""}><span class="${k}">${l}</span></label>`).join("")}</span></td></tr>`;}).join("")}</table></div>
    <div class="actions"><button class="btn">হাজিরা সংরক্ষণ</button></div></form>
    ${absent.length?`<div class="card" style="margin-top:14px"><h2>অনুপস্থিত — অভিভাবককে জানান</h2>${absent.map(s=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span>${esc(s.name)} (${esc(s.id)})</span>${s.phone||s.whatsapp?`<a class="btn s wa" target="_blank" href="${waLink(s.whatsapp||s.phone, fillTpl(S().tplAbsent,{নাম:s.name,আইডি:s.id,তারিখ:dFmt(a.date),প্রতিষ্ঠান:S().instName}))}">হোয়াটসঅ্যাপ</a>`:`<span class="muted small">নম্বর নেই</span>`}</div>`).join("")}</div>`:""}`
    :`<div class="card empty">এই শ্রেণিতে কোনো শিক্ষার্থী নেই</div>`}`;
  }
  if(tab === "report"){
    const list = activeStudents().filter(s=>!a.cls||s.classId===a.cls).sort((x,y)=>(num(x.roll)-num(y.roll))||x.id.localeCompare(y.id,"en",{numeric:true}));
    const recs = all("attendance").filter(r=>r.date>=a.from && r.date<=a.to && (!a.cls||r.classId===a.cls));
    const c = {}; list.forEach(s=>c[s.id]={P:0,A:0,L:0}); recs.forEach(r=>Object.entries(r.marks||{}).forEach(([sid,v])=>{ if(c[sid]&&c[sid][v]!=null) c[sid][v]++; }));
    UI.attReport = { list, c, title:`শিক্ষার্থী হাজিরা রিপোর্ট — ${className(a.cls)} — ${dFmt(a.from)} থেকে ${dFmt(a.to)}` };
    return tabs + `<div class="card"><div class="row"><label style="flex:1 1 220px">শ্রেণি<select data-change="att" data-k="cls">${classOptions(a.cls,true)}</select></label><label>শুরু<input type="date" data-change="att" data-k="from" value="${a.from}"></label><label>শেষ<input type="date" data-change="att" data-k="to" value="${a.to}"></label>
    <button class="btn l s" data-act="attPreset" data-v="month">এই মাস</button><button class="btn l s" data-act="attPreset" data-v="term">প্রান্তিক (৪ মাস)</button><button class="btn l s" data-act="attPreset" data-v="year">এই বছর</button><button class="btn" data-act="printAtt">প্রিন্ট</button></div></div>
    <div class="tw"><table><tr><th>আইডি</th><th>নাম</th><th>শ্রেণি</th><th class="right">উপস্থিত</th><th class="right">অনুপস্থিত</th><th class="right">ছুটি</th><th class="right">উপস্থিতির হার</th></tr>${list.map(s=>{const x=c[s.id]; const t=x.P+x.A+x.L; return `<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td class="small">${esc(className(s.classId))}</td><td class="right">${bn(x.P)}</td><td class="right">${bn(x.A)}</td><td class="right">${bn(x.L)}</td><td class="right">${t?bn(Math.round(x.P*100/t))+"%":"—"}</td></tr>`;}).join("")||`<tr><td colspan="7" class="empty">কোনো তথ্য নেই</td></tr>`}</table></div>`;
  }
  const staff = all("staff").filter(x=>x.active!==false).sort((x,y)=>x.id.localeCompare(y.id,"en",{numeric:true}));
  const ST = [["P","উপস্থিত"],["A","অনুপস্থিত"],["CL","নৈমিত্তিক ছুটি"],["ML","চিকিৎসা ছুটি"],["L","অন্যান্য ছুটি"]];
  if(tab === "staff"){
    const rec = get("staffAttendance", a.date); const marks = (rec&&rec.marks)||{};
    return tabs + `<div class="card"><div class="row"><label>তারিখ<input type="date" data-change="att" data-k="date" value="${a.date}"></label>${rec?`<span class="tag ok" style="align-self:center">হাজিরা নেওয়া হয়েছে</span>`:""}</div></div>
    ${staff.length?`<form data-form="saveStaffAtt"><div class="tw"><table><tr><th>আইডি</th><th>নাম</th><th>পদবি</th><th>হাজিরা</th></tr>${staff.map(s=>{const v=marks[s.id]||"P"; return `<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.designation)}</td><td><span class="att">${ST.map(([k,l])=>`<label><input type="radio" name="${esc(s.id)}" value="${k}" ${v===k?"checked":""}><span class="${k}">${l}</span></label>`).join("")}</span></td></tr>`;}).join("")}</table></div><div class="actions"><button class="btn">হাজিরা সংরক্ষণ</button></div></form>`
    :`<div class="card empty">আগে “শিক্ষক-কর্মচারী” পাতায় তালিকা যোগ করুন</div>`}`;
  }
  // staffReport
  const recs = all("staffAttendance").filter(r=>r.date>=a.from && r.date<=a.to);
  const c = {}; staff.forEach(s=>c[s.id]={P:0,A:0,CL:0,ML:0,L:0}); recs.forEach(r=>Object.entries(r.marks||{}).forEach(([sid,v])=>{ if(c[sid]&&c[sid][v]!=null) c[sid][v]++; }));
  UI.staffReport = { staff, c, title:`শিক্ষক-কর্মচারী হাজিরা রিপোর্ট — ${dFmt(a.from)} থেকে ${dFmt(a.to)}` };
  return tabs + `<div class="card"><div class="row"><label>শুরু<input type="date" data-change="att" data-k="from" value="${a.from}"></label><label>শেষ<input type="date" data-change="att" data-k="to" value="${a.to}"></label><button class="btn l s" data-act="attPreset" data-v="month">এই মাস</button><button class="btn l s" data-act="attPreset" data-v="year">এই বছর</button><button class="btn" data-act="printStaffAtt">প্রিন্ট</button></div></div>
  <div class="tw"><table><tr><th>আইডি</th><th>নাম</th>${ST.map(x=>`<th class="right">${x[1]}</th>`).join("")}</tr>${staff.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td>${ST.map(x=>`<td class="right">${bn(c[s.id][x[0]])}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="7" class="empty">কোনো তথ্য নেই</td></tr>`}</table></div>`;
};

/* ---------- ফি ও রসিদ ---------- */
VIEWS.fees = arg => {

  const tabs = `<div class="tabs"><a href="#fees/collect" class="${tab==="collect"?"on":""}">ফি আদায়</a><a href="#fees/dues" class="${tab==="dues"?"on":""}">বকেয়া ও রিমাইন্ডার</a><a href="#fees/report" class="${tab==="report"?"on":""}">আদায় রিপোর্ট</a><a href="#fees/waivers" class="${tab==="waivers"?"on":""}">মওকুফ</a></div>`;
  const s0 = S();
  if(tab === "collect"){
    if(sidArg) UI.feeSid = decodeURIComponent(sidArg);
    const s = UI.feeSid ? get("students", UI.feeSid) : null;
    const pick = `<div class="card"><label>শিক্ষার্থী নির্বাচন (আইডি বা নাম লিখুন)<input list="stuList" data-change="feePick" value="${esc(studentLabel(s))}" placeholder="যেমন: STD-101"></label><datalist id="stuList">${activeStudents().map(x=>`<option value="${esc(studentLabel(x))}">`).join("")}</datalist></div>`;

    const fee = num(s.monthlyFee); const due = unpaid(s, addMonths(thisMonth(), 2)); const cut = dueCutoff();
    const heads = all("feeHeads").sort((a,b)=>(a.order||0)-(b.order||0));
    return tabs + pick + `<form data-form="savePay" class="card"><h2>${esc(s.name)} <span class="tag">${esc(s.id)}</span> <span class="small muted">${esc(className(s.classId))}</span></h2>
    <p class="small">মাসিক বেতন: <b>${money(fee)}</b>${fee?"":" — শিক্ষার্থীর প্রোফাইলে মাসিক বেতন নির্ধারণ করুন"}</p>

    <h2 style="font-size:1rem;margin-top:16px">অন্যান্য ফি</h2><div class="fgrid">${heads.map(h=>`<label>${esc(h.name)}<input name="head_${h.id}" inputmode="numeric" placeholder="${h.amount?bn(h.amount):"০"}" data-change="payCalc"></label>`).join("")}</div>

    <div class="row" style="justify-content:space-between;margin-top:16px;align-items:center"><div style="font-size:1.3rem">মোট: <b id="payTotal">${money(due.filter(m=>m<=cut).length*fee)}</b><div class="small muted" id="payWords"></div></div><button class="btn g">আদায় ও রসিদ প্রিন্ট</button></div></form>`;
  }
  if(tab === "dues"){
    const dl = duesList(); const m = thisMonth();
    return tabs + `<div class="banner"><span>বকেয়া হিসাব: প্রতি মাসের ${bn(num(s0.dueDay)||10)} তারিখের পর ওই মাস বকেয়া ধরা হয়। নিচের বোতাম চাপলে হোয়াটসঅ্যাপে মেসেজ তৈরি হয়ে খুলবে, শুধু “Send” চাপুন।</span>${dl.length?`<button class="btn s wa" data-act="nextReminder">ক্রমানুসারে পরেরটি পাঠান</button>`:""}</div>
    ${dl.length?`<div class="tw"><table><tr><th>আইডি</th><th>নাম</th><th>শ্রেণি</th><th>বকেয়া মাস</th><th class="right">টাকা</th><th></th></tr>${dl.map(d=>{const sent=(META.sent||{})[d.s.id+"|"+m]; const ph=d.s.whatsapp||d.s.phone; return `<tr><td>${esc(d.s.id)}</td><td><a href="#student/${encodeURIComponent(d.s.id)}">${esc(d.s.name)}</a></td><td class="small">${esc(className(d.s.classId))}</td><td class="small">${d.months.map(mName).join(", ")}</td><td class="right"><b>${money(d.amount)}</b></td>
    <td>${ph?`<a class="btn s wa" target="_blank" data-act="markSent" data-id="${esc(d.s.id)}" href="${waLink(ph, dueMsg(d))}">${sent?"আবার পাঠান":"রিমাইন্ডার"}</a>`:`<span class="muted small">নম্বর নেই</span>`} ${sent?`<span class="tag ok">পাঠানো ${dFmt(sent)}</span>`:""} <a class="btn s l" href="#fees/collect/${encodeURIComponent(d.s.id)}">আদায়</a></td></tr>`;}).join("")}
    <tr><th colspan="4">মোট</th><th class="right">${money(dl.reduce((a,d)=>a+d.amount,0))}</th><th></th></tr></table></div>`:`<div class="card empty">আলহামদুলিল্লাহ, কোনো বকেয়া নেই</div>`}`;

function defaultFee(res){ const s = S(); return num(res==="আবাসিক" ? s.feeRes : s.feeNonRes); }
const afterRender = fn => setTimeout(fn, 0);

function applyRestore(data){
  const now = Date.now(); const nd = {}; TABLES.forEach(t => nd[t] = data[t] || {});
  DB = nd; META.dirty = {}; TABLES.forEach(t => Object.values(DB[t]).forEach(r => { r.updatedAt = now; META.dirty[t+"|"+r.id] = 1; }));
  flush().then(() => { if(ME && !get("users", ME.id)) ME = null; render(); toast("রিস্টোর সম্পন্ন"); });
}

const CSV_COLS = [["id","আইডি"],["name","নাম"],["nameEn","নাম (ইংরেজি)"],["father","পিতা"],["mother","মাতা"],["dob","জন্ম তারিখ"],["birthReg","জন্মনিবন্ধন"],["phone","মোবাইল"],["whatsapp","হোয়াটসঅ্যাপ"],["className","শ্রেণি"],["dept","বিভাগ"],["group","গ্রুপ"],["roll","রোল"],["residential","থাকা"],["admissionDate","ভর্তির তারিখ"],["monthlyFee","মাসিক বেতন"],["hifz","হিফজ"],["address","ঠিকানা"],["status","অবস্থা"]];

const CHANGES = {
  sf(el, ev){ if(el.tagName==="INPUT" && ev.type!=="input") return; if(el.tagName!=="INPUT" && ev.type==="input") return; UI.sf[el.dataset.k] = el.value; UI.refocus = el.dataset.k; render(); },
  att(el, ev){ if(ev.type==="input") return; UI.att[el.dataset.k] = el.value; render(); },
  fr(el, ev){ if(ev.type==="input") return; UI.fr[el.dataset.k] = el.value; render(); },
  feePick(el, ev){ const id = el.value.split(" — ")[0].trim(); if(get("students", id)){ UI.feeSid = id; location.hash = "#fees/collect/"+encodeURIComponent(id); render(); } },
  wPick(el){ const id = el.value.split(" — ")[0].trim(); if(get("students", id)){ UI.wSid = id; render(); } },
  payCalc(el){ const f = el.closest("form"); const s = get("students", UI.feeSid); if(!f||!s) return; const d = formData(f);
    let t = [].concat(d.months||[]).length * num(s.monthlyFee); all("feeHeads").forEach(h => t += num(d["head_"+h.id]));
    document.getElementById("payTotal").textContent = money(t); document.getElementById("payWords").textContent = t ? "কথায়: " + inWords(t) + " টাকা মাত্র" : ""; },
  promFrom(el, ev){ if(ev.type==="input") return; UI.promFrom = el.value; promoteModal(); },
  logo(el){ const file = el.files[0]; if(!file) return; const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); const k = 160/Math.max(img.width,img.height); c.width = img.width*k; c.height = img.height*k; c.getContext("2d").drawImage(img,0,0,c.width,c.height); META.logo = c.toDataURL("image/png"); save(); render(); toast("লোগো যোগ হয়েছে"); }; img.src = r.result; }; r.readAsDataURL(file); },
  importCSV(el){ const file = el.files[0]; if(!file) return; const r = new FileReader(); r.onload = () => {
    const rows = parseCSV(r.result); if(rows.length < 2) return toast("ফাইলে কোনো তথ্য নেই");
    const head = rows[0].map(h => { h = h.trim(); const c = CSV_COLS.find(x => x[1]===h || x[0]===h); return c ? c[0] : null; });
    if(!head.includes("name")) return toast("‘নাম’ কলাম পাওয়া যায়নি — এক্সপোর্ট করা ফাইলের কলাম নাম ব্যবহার করুন");
    let n = 0;
    rows.slice(1).forEach(row => { const o = {}; head.forEach((k,i) => { if(k) o[k] = (row[i]||"").trim(); }); if(!o.name) return;
      let cls = classesSorted().find(c => c.name===o.className && (!o.dept || c.dept===o.dept)) || classesSorted().find(c => c.name===o.className);
      if(!cls && o.className){ cls = put("classes", { id:uid("C"), name:o.className, dept:o.dept||"", order:all("classes").length+1 }); }
      const old = o.id ? DB.students[o.id] : null;
      const s = Object.assign(old || {}, o, { classId: cls ? cls.id : (old && old.classId) || "", status: o.status==="প্রস্থান" ? "left" : "active", monthlyFee: o.monthlyFee!==undefined && o.monthlyFee!=="" ? num(o.monthlyFee) : defaultFee(o.residential) });
      delete s.className; delete s.dept; if(!s.id) s.id = nextStudentId(); s.deleted = false; put("students", s); n++; });
    render(); toast(bn(n) + " জন শিক্ষার্থী ইমপোর্ট হয়েছে"); }; r.readAsText(file, "utf-8"); },
  restoreFile(el){ const file = el.files[0]; if(!file) return; const r = new FileReader(); r.onload = () => { try{ const j = JSON.parse(r.result); if(!j.DB) throw 0;
      if(!all("users").length){ applyRestore(j.DB); return; }
      confirmBox(`${dFmt((j.at||"").slice(0,10))} তারিখের ব্যাকআপ রিস্টোর করবেন? বর্তমান তথ্যের জায়গায় ব্যাকআপের তথ্য বসবে।`, () => applyRestore(j.DB), "রিস্টোর করুন");
    }catch(e){ toast("এটি সঠিক ব্যাকআপ ফাইল নয়"); } }; r.readAsText(file); }
};

document.addEventListener("submit", e => { const f = e.target; if(f.dataset.form && FORMS[f.dataset.form]){ e.preventDefault(); FORMS[f.dataset.form](f); } });
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if(!el) return; const fn = ACTS[el.dataset.act]; if(!fn) return; if(el.tagName !== "A") e.preventDefault(); fn(el, e); });
["change","input"].forEach(t => document.addEventListener(t, e => { const el = e.target.closest("[data-change]"); if(!el) return; const fn = CHANGES[el.dataset.change]; if(!fn) return;
  if(t==="input" && !["sf","payCalc","feePick","wPick"].includes(el.dataset.change)) return;
  if(t==="change" && el.dataset.change==="sf" && el.tagName==="INPUT") return;
  fn(el, e); }));
const _render = render;
render = function(){ _render(); if(UI.refocus){ const el = document.querySelector(`[data-change="sf"][data-k="${UI.refocus}"]`); UI.refocus = null; if(el && el.tagName==="INPUT"){ el.focus(); const n = el.value.length; el.setSelectionRange(n,n); } } };

    <label class="chk"><input type="checkbox" name="showStats" ${s.showStats!==false?"checked":""}> মোট শিক্ষার্থী ও শিক্ষক সংখ্যা ওয়েবসাইটে দেখান</label>
    <label class="chk"><input type="checkbox" name="showFees" ${s.showFees!==false?"checked":""}> ফি ও মাসিক বেতন ওয়েবসাইটে দেখান (সেটিংসের হার ও ফি-এর খাত থেকে)</label>
    <div class="fgrid" style="margin-top:12px"><label>ওয়েবসাইটের ঠিকানা<input name="siteUrl" value="${esc(s.siteUrl||SITE_URL)}"></label><label>অভিভাবক লগইন পাতার ঠিকানা<input name="portalUrl" value="${esc(s.portalUrl||PORTAL_URL)}"></label></div>
    <p class="small muted">ভর্তি ও অভিযোগ ফরমের লিংক সেটিংস পাতায় দিলে ওয়েবসাইটে “অনলাইনে আবেদন” বোতাম দেখাবে।</p>
    <div class="actions"><button class="btn">সংরক্ষণ</button></div></form>`;
};

Object.assign(FORMS, {
  saveNotice(f){ const d = formData(f); const old = d.id ? get("notices", d.id) : null;
    const n = Object.assign(old || { id:uid("N") }, { title:d.title.trim(), date:d.date||today(), tag:d.tag, body:d.body, published:!!d.published });
    put("notices", n); closeModal(); render(); toast(n.published ? "নোটিশ সংরক্ষিত — সিঙ্কের পর ওয়েবসাইটে দেখাবে" : "নোটিশ সংরক্ষিত"); },
  saveBook(f){ const d = formData(f); const old = d.id ? get("books", d.id) : null;
    const b = Object.assign(old || { id:uid("B"), order:all("books").length+1 }, { name:d.name.trim(), category:d.category, level:d.level, price:num(d.price), mrp:num(d.mrp), status:d.status, stock:num(d.stock), desc:d.desc, published:!!d.published, featured:!!d.featured });
    put("books", b); closeModal(); render(); toast("বইয়ের তথ্য সংরক্ষিত"); },
  saveSite(f){ const d = formData(f); setS({ admissionOpen:!!d.admissionOpen, admissionMsg:d.admissionMsg, admissionDeadline:d.admissionDeadline||"", whatsapp:d.whatsapp||"", showStats:!!d.showStats, showFees:!!d.showFees, siteUrl:d.siteUrl.trim(), portalUrl:d.portalUrl.trim() }); render(); toast("সংরক্ষিত — সিঙ্কের পর ওয়েবসাইটে দেখাবে"); }
});

Object.assign(ACTS, {
  newNotice(){ modal(noticeForm()); },
  editNotice(el){ modal(noticeForm(get("notices", el.dataset.id))); },
  toggleNotice(el){ const n = get("notices", el.dataset.id); if(!n) return; n.published = !n.published; put("notices", n); render(); },
  delNotice(el){ confirmBox("নোটিশটি মুছে ফেলবেন? ওয়েবসাইট থেকেও সরে যাবে।", () => { remove("notices", el.dataset.id); render(); }, "মুছুন"); },
  printNotice(el){ const n = get("notices", el.dataset.id); if(!n) return;
    printHTML(printHead("নোটিশ") + `<p style="text-align:right">তারিখ: ${dFmt(n.date)}</p><h2 style="text-align:center;font-size:17px;margin:14px 0">বিষয়: ${esc(n.title)}</h2><div style="font-size:14px;line-height:1.9;white-space:pre-wrap;min-height:120mm">${esc(n.body||"")}</div><div class="sig" style="justify-content:flex-end"><span>কর্তৃপক্ষ<br>${esc(S().instName||"")}</span></div>`); },
  newBook(){ modal(bookForm()); },
  editBook(el){ modal(bookForm(get("books", el.dataset.id))); },
  toggleBook(el){ const b = get("books", el.dataset.id); if(!b) return; b.published = !b.published; put("books", b); render(); },
  seedBooks(){ if(all("books").length) return; let o = 0; SEED_BOOKS.forEach(([ci, names]) => names.forEach(n => put("books", { id:uid("B"), name:n, category:BOOK_CATS[ci], level:"", price:0, mrp:0, status:"প্রস্তুত", stock:0, desc:"", published:true, featured:["আমার প্রথম পাঠ","আমার দ্বিতীয় পাঠ","আদর্শ হিফজ কায়দা"].includes(n), order:++o })));
    render(); toast("৩২টি বই যোগ হয়েছে — এবার দাম বসান"); },
  async newPin(el){ const s = get("students", el.dataset.id); if(!s || ME.role==="teacher") return;
    const pin = genPin(); s.pinHash = await hashPin(pin, s.id); put("students", s); render();
    const s0 = S(); const ph = s.whatsapp || s.phone; const msg = fillTpl(s0.tplPin || "{নাম}-এর অভিভাবক অ্যাকাউন্টের পিন: {পিন}\n{পোর্টাল}", { নাম:s.name, আইডি:s.id, পিন:pin, পোর্টাল:s0.portalUrl||PORTAL_URL, প্রতিষ্ঠান:s0.instName });
    modal(`<h2>নতুন পিন — ${esc(s.name)}</h2><p>আইডি: <b>${esc(s.id)}</b><br>পিন: <b style="font-size:1.4rem;letter-spacing:.1em">${bn(pin)}</b></p><p class="small muted">পিনটি শুধু এখন দেখা যাবে। আগের পিন আর কাজ করবে না (সিঙ্কের পর)।</p><div class="actions"><button class="btn l" data-act="closeModal">বন্ধ করুন</button>${ph?`<a class="btn wa" target="_blank" href="${waLink(ph, msg)}">হোয়াটসঅ্যাপে পাঠান</a>`:""}</div>`); },
  async installApp(){ const e = UI.installEvt; if(!e) return; e.prompt(); try{ await e.userChoice; }catch(x){} UI.installEvt = null; render(); }
});

/* ইনস্টলযোগ্য অ্যাপ (PWA) */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); UI.installEvt = e; const b = document.getElementById("installBtn"); if(b) b.hidden = false; });
window.addEventListener("appinstalled", () => { UI.installEvt = null; toast("অ্যাপ ইনস্টল হয়েছে"); render(); });
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }

/* ============ চালু ============ */
(async function boot(){
  await IDB.open();
  const d = await IDB.get("db"), m = await IDB.get("meta");
  if(d){ TABLES.forEach(t => DB[t] = d[t] || {}); }
  if(m){ META = Object.assign(META, m); META.sync = Object.assign({url:"",key:"",auto:true}, m.sync||{}); }
  if(!META.device){ META.device = String.fromCharCode(65+Math.floor(Math.random()*26), 65+Math.floor(Math.random()*26)); save(); }
  try{ const id = sessionStorage.getItem("bjha_me"); if(id){ const u = get("users", id); if(u && u.active!==false) ME = u; } }catch(e){}
  render();
  if(ME && META.sync.auto) syncNow();
})();
</script>
</body>
